$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/views.schema.yaml
title: view
description: |
  One curated view of the merged architecture model. Views are authored as YAML
  under views/ (one file per view, ordered by views/_order.yaml), validated and
  inlined into architecture.json by tooling/collect.py, and surfaced as a tab
  strip in the viewer.

  Selection algorithm (also documented in the viewer, src/views/scope.ts):

      base   = elements matching predicate (AND across fields, OR within a field)
      base   = (base ∪ include) − exclude
      scoped = base ∪ { elements within neighbourDepth relation-hops of base }

  `excludeInstances: true` first removes runtime instances (elements carrying an
  `environment` and/or `stats.release`) from the universe, so they appear in
  neither the base nor the expansion — a definitions-only view.

  Environment is NOT part of the resolved scope — it is applied by the viewer's
  live Environment filter, seeded to `defaultEnvironment` (default "prd") on
  open, so a view can still reveal dev/tst/uat within its scope.

type: object
additionalProperties: false
required: [id, label, description, icon]
properties:
  id:
    type: string
    pattern: ^[a-z][a-z0-9-]*$
    description: |
      Stable view id. Kebab-case. Doubles as the ?view= URL value and the key
      listed in views/_order.yaml. `everything` is reserved for the synthesised
      escape-hatch view and may not be authored.
  label:
    type: string
    minLength: 1
    description: Tab label shown in the viewer's view strip.
  icon:
    type: string
    pattern: ^[A-Z][A-Za-z0-9]*$
    description: |
      Lucide icon name in PascalCase, exactly as exported by lucide-react (e.g.
      `Map`, `Database`, `ScanLine`). Rendered as the glyph on the view's tab.
      Resolved against the lucide-react registry at render time — an
      unrecognised name fails loudly in the viewer, there is no default glyph.
  description:
    type: string
    minLength: 1
    description: One-line summary of what the view scopes (tooltip / picker text).
  predicate:
    type: object
    additionalProperties: false
    description: |
      Attribute selector over existing dimensions. Within a field the values
      OR; across fields they AND. An absent or empty predicate matches every
      element (the Everything view's shape) — unless an `include` list is also
      given, in which case the view is include-only and shows exactly the listed
      elements (a curated view, e.g. the Landscape landing page).
    properties:
      layers:
        $ref: "#/$defs/valueList"
        description: ArchiMate layer ids (technology, application, strategy, business, cross-cutting).
      kinds:
        $ref: "#/$defs/valueList"
        description: ArchiMate kind names (Node, Device, SystemSoftware, ApplicationComponent, …).
      producers:
        $ref: "#/$defs/valueList"
        description: Registered producer ids (must appear in pipeline-producers.yaml).
      capabilities:
        $ref: "#/$defs/valueList"
        description: |
          Capability ids (from enums/capabilities.yaml). An element matches if it
          is the capability node itself or realises one of the listed capabilities.
      lifecycle:
        $ref: "#/$defs/valueList"
        description: Lifecycle states (active, deprecated, removed).
      environments:
        $ref: "#/$defs/valueList"
        description: Environment ids (dev, tst, uat, prd). Rarely needed — prefer defaultEnvironment.
      releases:
        $ref: "#/$defs/valueList"
        description: |
          Helm release names — the `stats.release` an instance carries (e.g.
          `design-assistant@prd`, or `scantopdf` for a single-environment
          release). Selects a deployed system's runtime as one set; with
          neighbourDepth the definitions those instances specialise are pulled
          back in. The grouping handle for per-system views, where the release is
          the real boundary. Validated against the releases present in the merged
          dataset.
  include:
    $ref: "#/$defs/valueList"
    description: |
      Explicit element ids folded into the base set after the predicate, for
      sets no predicate cleanly expresses. Every id must resolve in the merged
      dataset — a dangling include fails the build. With no predicate, the
      include list IS the base (an include-only curated view); with a predicate
      it augments the matched set.
  exclude:
    $ref: "#/$defs/valueList"
    description: |
      Explicit element ids removed from the base set after include. Every id
      must resolve in the merged dataset.
  excludeInstances:
    type: boolean
    description: |
      Drop runtime instances — elements carrying an `environment` (they live in
      dev/tst/uat/prd) and/or a `stats.release` (a Helm release's deployed
      workloads/containers) — from the view entirely. A definition is
      environment-agnostic; an instance is a concrete deployed unit. Excluded
      instances appear in neither the base nor the neighbour expansion, so the
      view shows architectural definitions only and neighbourDepth cannot pull
      instances back in. Defaults to false.
  excludeKinds:
    $ref: "#/$defs/valueList"
    description: |
      ArchiMate kind names (Node, Device, …) dropped from the view entirely —
      the same universe gate as `excludeInstances`, keyed on kind. An excluded
      kind appears in neither the base nor the neighbour expansion and is not
      traversed, so neighbourDepth cannot pull it back. Use to keep a class of
      element out of an otherwise-broad view, e.g. the physical Device fleet out
      of the application Landscape.
  excludeProducers:
    $ref: "#/$defs/valueList"
    description: |
      Registered producer ids (must appear in pipeline-producers.yaml) whose
      every element is dropped from the view — the same universe gate as
      `excludeInstances`/`excludeKinds`, keyed on producer. Use to keep a whole
      source out of an otherwise-broad view, e.g. the home-automation/IoT device
      fleets and the helm-charts release instances out of Infrastructure.
  neighbourDepth:
    type: integer
    minimum: 0
    description: |
      Relation hops to expand the base set by, following relations undirected.
      0 = no expansion (just the base set).
  defaultEnvironment:
    type: string
    description: |
      Environment the viewer seeds its Environment filter to when the view
      opens. Defaults to "prd" when omitted.
$defs:
  valueList:
    type: array
    minItems: 1
    items:
      type: string
      minLength: 1
