# Architecture repo as self-producer — shared external services.
#
# Canonical entries for external SaaS that more than one in-house producer
# consumes, lifted here so they're declared once and referenced by UUID rather
# than re-minted per consumer. (First entry: OpenAI, consumed by design-assistant,
# electronics-inventory, and newsfilter.) Single-consumer external services stay
# in their consuming producer until reuse appears.

schemaVersion: "0.1"
producer: architecture

applicationServices:
  - id: svc:openai-api,b4e2a983-5c32-4ed1-94a1-6231a2112ccb
    label: OpenAI API
    summary: >-
      OpenAI HTTP API (chat completions, embeddings) consumed by in-house apps
      for AI features. Hardcoded SDK base URL; consumers carry no boundBy.
    introduced: 2026-05-31
    lifecycle: active
    logo: openai
    stats:
      homepage: https://openai.com/
