# Architecture repo as self-producer — the shared catalog.
#
# Third-party «SoftwareProduct» entries, declared once here and referenced by
# UUID: the deploy repos' running instances Specialize them. Plus the two
# in-cluster Ceph storage services the ceph-csi deploy repos' instances
# realize. Every edge to these elements is authored in the consuming
# producer's own artifact, not here.

schemaVersion: "0.1"
producer: architecture

