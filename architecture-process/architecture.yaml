# Architecture artifact starter skeleton.
#
# Replace placeholders. Drop the sections you don't need; everything
# except `schemaVersion` and `producer` is optional at the envelope
# level. Per-element required fields are enforced by the validator —
# run
#   ./scripts/arch-validate architecture.yaml
# after each edit until it's clean.
#
# IDs:
#   - Instance kinds → composite form: <kind>:<hint>,<uuid4>
#     Mint UUIDs with: python -c 'import uuid; print(uuid.uuid4())'
#     Once minted, NEVER re-mint. Commit them next to this file so
#     they're stable across builds.
#   - Curated / catalog kinds → bare kebab.
#
# Provenance: the collector stamps a `producer:` attribute on every
# merged element from the envelope key below. Producers must NOT emit
# `producer:` on individual elements — per-kind schemas reject it via
# additionalProperties: false.
#
# See producer-manual.md for the full vocabulary, allowed relation triples,
# stereotype rules, and inclusion criteria.

schemaVersion: "0.1"
producer: <PRODUCER-ID>          # bare kebab; must match this repo's entry in pipeline-producers.yaml

# ─── Replace / remove sections below as appropriate ─────────────────

# devices:
#   - id: device:<hint>,<uuid4>
#     label: ...
#     summary: ...
#     introduced: 2026-05-27
#     lifecycle: active

# nodes:
#   - id: node:<hint>,<uuid4>
#     label: ...
#     summary: ...
#     introduced: 2026-05-27
#     lifecycle: active
#     cluster: prd                  # optional, free-form cluster id
#     environment: prd              # optional: dev | tst | uat | prd

# systemSoftware:
#   - id: ss:<hint>,<uuid4>          # composite for running instances
#     label: ...
#     summary: ...
#     introduced: 2026-05-27
#     lifecycle: active
#     environment: prd
#     cluster: prd
#
#   - id: ss:<product-name>,<uuid>   # composite; SoftwareProduct catalog entry (UUID is the normative cross-producer ref)
#     label: ...
#     summary: ...
#     introduced: 2026-05-27
#     lifecycle: active
#     stereotype: SoftwareProduct
#     homepage: https://...
#     logo: <name>.svg
#     sourceRepository: git:<owner>/<repo>    # optional, informational

# applicationComponents:
#   - id: app:<hint>,<uuid4>
#     ...

# applicationServices:
#   - id: svc:<hint>,<uuid4>
#     ...

# applicationInterfaces:
#   - id: if:<hint>,<uuid4>
#     ...

# technologyServices:
#   - id: svc:<hint>,<uuid4>
#     ...

# technologyInterfaces:
#   - id: if:<hint>,<uuid4>
#     ...

# No capabilities: array. Producers never declare Capability elements —
# capabilities are declared only in the Architecture repo's enum. Reference a
# cap: id as a Realization/Association target (e.g. target: cap:secrets-management)
# and the collector backfills the node from the enum. See producer-manual.md
# § Capability enum. The id must exist in the enum; adding one is a PR against
# schema/v0.1/enums/capabilities.yaml in the Architecture repo.

# businessServices:
#   - id: bsvc:<kebab>
#     ...

# groupings:
#   - id: grp:<hint>,<uuid4>
#     ...

# relations:
#   - id: rel:<kebab-or-uuid>
#     source: <element-id>
#     target: <element-id>
#     type: <ArchiMate type — see producer-manual.md § Relations>
