schemaVersion: "0.1"
producer: helm
systemSoftware:
  # Off-the-shelf product carrying an explicit logo — a specializing instance
  # inherits it (Specialization wins over any producer default).
  - id: ss:rabbitmq,22222222-2222-4222-8222-222222222221
    label: RabbitMQ
    summary: Broker product.
    introduced: 2024-07-12
    lifecycle: active
    stereotype: SoftwareProduct
    logo: rabbitmq
  - id: ss:widget-prd-broker,22222222-2222-4222-8222-222222222222
    label: widget/broker (prd)
    summary: Running broker for Widget.
    introduced: 2024-07-12
    lifecycle: active
    environment: prd
    cluster: prd
applicationComponents:
  # Instance specializes the widget product -> inherits the product's resolved
  # logo (the producer default, ansible).
  - id: app:widget-prd-app,33333333-3333-4333-8333-333333333331
    label: widget/app (prd)
    summary: Running Widget.
    introduced: 2024-07-12
    lifecycle: active
    environment: prd
    cluster: prd
applicationServices:
  # Realized by the instance -> inherits its logo.
  - id: svc:widget-prd,44444444-4444-4444-8444-444444444441
    label: widget (prd)
    summary: Widget service.
    introduced: 2024-07-12
    lifecycle: active
    environment: prd
    cluster: prd
applicationInterfaces:
  # Assigned to the service -> inherits its logo.
  - id: if:widget,55555555-5555-4555-8555-555555555551
    label: widget.home
    summary: Widget ingress.
    introduced: 2024-07-12
    lifecycle: active
    environment: prd
    cluster: prd
    stats:
      url: widget.home
relations:
  - id: rel:app-spec-product
    source: app:widget-prd-app,33333333-3333-4333-8333-333333333331
    target: app:widget,11111111-1111-4111-8111-111111111111
    type: Specialization
  - id: rel:broker-spec-rabbitmq
    source: ss:widget-prd-broker,22222222-2222-4222-8222-222222222222
    target: ss:rabbitmq,22222222-2222-4222-8222-222222222221
    type: Specialization
  - id: rel:app-realizes-svc
    source: app:widget-prd-app,33333333-3333-4333-8333-333333333331
    target: svc:widget-prd,44444444-4444-4444-8444-444444444441
    type: Realization
  - id: rel:if-assign-svc
    source: if:widget,55555555-5555-4555-8555-555555555551
    target: svc:widget-prd,44444444-4444-4444-8444-444444444441
    type: Assignment
