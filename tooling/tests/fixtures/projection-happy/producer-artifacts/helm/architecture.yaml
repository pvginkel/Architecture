schemaVersion: "0.1"
producer: helm
# Exercises project_instance_relations (collect.py). Two software products,
# each a definition with deployed instance(s) that Specialize it; the collector
# lifts instance-level edges onto the definitions.
systemSoftware:
  # elasticsearch: definition + prd/dev instances.
  - id: ss:elasticsearch,11111111-1111-4111-8111-111111111111
    label: Elasticsearch
    summary: Search engine (catalogue definition).
    introduced: 2024-01-01
    lifecycle: active
  - id: ss:elasticsearch-prd,11111111-1111-4111-8111-111111111112
    label: Elasticsearch (prd)
    summary: Deployed Elasticsearch, prd.
    introduced: 2024-01-01
    lifecycle: active
    environment: prd
  - id: ss:elasticsearch-dev,11111111-1111-4111-8111-111111111113
    label: Elasticsearch (dev)
    summary: Deployed Elasticsearch, dev.
    introduced: 2024-01-01
    lifecycle: active
    environment: dev
  # nginx: definition + prd instance. Its def-level Serving edge is AUTHORED,
  # so the projection of the instance edge must dedup against it (no derived).
  - id: ss:nginx,33333333-3333-4333-8333-333333333331
    label: nginx
    summary: Reverse proxy (catalogue definition).
    introduced: 2024-01-01
    lifecycle: active
  - id: ss:nginx-prd,33333333-3333-4333-8333-333333333332
    label: nginx (prd)
    summary: Deployed nginx, prd.
    introduced: 2024-01-01
    lifecycle: active
    environment: prd
  # orphan: a prd instance with NO Specialization to a definition. Edges
  # touching it cannot be lifted and are dropped.
  - id: ss:orphan-prd,44444444-4444-4444-8444-444444444441
    label: Orphan service (prd)
    summary: Deployed service with no catalogue definition.
    introduced: 2024-01-01
    lifecycle: active
    environment: prd
applicationComponents:
  - id: app:search-app,22222222-2222-4222-8222-222222222221
    label: Search app
    summary: Application using search (definition).
    introduced: 2024-01-01
    lifecycle: active
  - id: app:search-app-prd,22222222-2222-4222-8222-222222222222
    label: Search app (prd)
    summary: Deployed search app, prd.
    introduced: 2024-01-01
    lifecycle: active
    environment: prd
capabilities:
  - id: cap:full-text-search
    label: Full-text search
    summary: Full-text search capability.
    introduced: 2024-01-01
    lifecycle: active
relations:
  # Instance -> definition Specialization: the lift map.
  - id: rel:es-prd-specializes-es
    source: ss:elasticsearch-prd,11111111-1111-4111-8111-111111111112
    target: ss:elasticsearch,11111111-1111-4111-8111-111111111111
    type: Specialization
  - id: rel:es-dev-specializes-es
    source: ss:elasticsearch-dev,11111111-1111-4111-8111-111111111113
    target: ss:elasticsearch,11111111-1111-4111-8111-111111111111
    type: Specialization
  - id: rel:nginx-prd-specializes-nginx
    source: ss:nginx-prd,33333333-3333-4333-8333-333333333332
    target: ss:nginx,33333333-3333-4333-8333-333333333331
    type: Specialization
  - id: rel:search-prd-specializes-search
    source: app:search-app-prd,22222222-2222-4222-8222-222222222222
    target: app:search-app,22222222-2222-4222-8222-222222222221
    type: Specialization
  # Basic projection: both endpoints are instances that lift.
  # => derived ss:elasticsearch --Serving--> app:search-app
  - id: rel:es-prd-serves-search-prd
    source: ss:elasticsearch-prd,11111111-1111-4111-8111-111111111112
    target: app:search-app-prd,22222222-2222-4222-8222-222222222222
    type: Serving
  # Definition endpoint passthrough: target (capability) is already a definition.
  # => derived ss:elasticsearch --Realization--> cap:full-text-search
  - id: rel:es-prd-realizes-search-cap
    source: ss:elasticsearch-prd,11111111-1111-4111-8111-111111111112
    target: cap:full-text-search
    type: Realization
  # Self-loop drop: both instances lift to the SAME definition (elasticsearch).
  - id: rel:es-prd-serves-es-dev
    source: ss:elasticsearch-prd,11111111-1111-4111-8111-111111111112
    target: ss:elasticsearch-dev,11111111-1111-4111-8111-111111111113
    type: Serving
  # Dedup: authored def-level edge that the nginx instance edge would project to.
  - id: rel:nginx-serves-search
    source: ss:nginx,33333333-3333-4333-8333-333333333331
    target: app:search-app,22222222-2222-4222-8222-222222222221
    type: Serving
  - id: rel:nginx-prd-serves-search-prd
    source: ss:nginx-prd,33333333-3333-4333-8333-333333333332
    target: app:search-app-prd,22222222-2222-4222-8222-222222222222
    type: Serving
  # Unliftable drop: orphan instance has no definition to lift to.
  - id: rel:orphan-prd-serves-search-prd
    source: ss:orphan-prd,44444444-4444-4444-8444-444444444441
    target: app:search-app-prd,22222222-2222-4222-8222-222222222222
    type: Serving
