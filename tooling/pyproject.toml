[project]
name = "architecture-tooling"
version = "0.1.0"
description = "Schema generator and validator for the architecture metaschema."
authors = [{name = "Pieter van Ginkel"}]
requires-python = ">=3.11,<4.0"
dependencies = [
    "xmlschema (>=4.0.0,<5.0.0)",
    "pyyaml (>=6.0,<7.0)",
    "jsonschema (>=4.0,<5.0)",
    "click (>=8.0,<9.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.10"
types-pyyaml = "^6.0"
types-jsonschema = "^4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
