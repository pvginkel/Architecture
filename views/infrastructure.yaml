id: infrastructure
label: Infrastructure & network
description: The physical and host substrate — servers, network hardware, and the system software that runs on them.
icon: Network
predicate:
  kinds: [Node, Device, SystemSoftware]
# Keep the substrate (compute Nodes, network Devices, host system software), drop
# the noise: the home-automation/IoT device fleets belong in their own views. Note
# this can't be excludeInstances — the prd server Nodes are themselves env-tagged
# instances, and dropping instances would delete the servers.
excludeProducers: [home-automation-fleet, iotsupport-app]
# The shared catalog's products (docs/architecture/catalog.yaml) are the
# software the deploy repos run, not substrate. They share the architecture
# producer with the rack hardware, so they are excluded by id.
