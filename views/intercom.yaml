id: intercom
label: Intercom
description: The Intercom — a voice intercom backed by OpenAI and a fleet of MCP servers (Home Assistant, Telegram, Gitblit, Trello), serving 12 units around the house.
icon: Radio
# The release is the grouping handle and
# the named definition is the anchor that carries the consumes-* edges, so depth 1
# lands OpenAI and every MCP server it talks to. The release `intercom` is
# single-environment (no @env suffix).
#
# The 12 physical units are included explicitly because they sit two hops out
# (unit -> firmware -> server), past neighbourDepth 1. Their per-unit firmware
# (the iotsupport-app `intercom-vN @ <hash>` SystemSoftware) is the bridge that
# carries the Mosquitto / Keycloak / Home Assistant / server connections, so it
# is left in — without it the units float unconnected. iotsupport-app is not
# excluded here: the intercom subgraph is self-contained, so depth 1 pulls in
# only the intercom firmware, none of that producer's other gadgets.
#
# The systems behind the MCP servers (Jenkins, the Trello MCP server, Gitblit,
# Home Assistant) sit two hops out too (system -> MCP server or filter ->
# server). They are includeUnexpanded, not include: an include is expanded as
# well, and depth 1 from these systems would pull in everything else they touch
# (Home Assistant's device fleet and the other gadgets' firmware, the Jenkins
# telegram bot, their product definitions).
predicate:
  releases: [intercom]
include:
  - app:intercom-server,c313fb20-b8df-4f6c-be1b-23af65e26705 # Intercom Server (anchor)
  # All intercom units, matched by id prefix so the volatile per-deployment hash
  # in each id (device:intercom-vN-<hash>) doesn't need pinning.
  - "/^device:intercom-v/"
includeUnexpanded:
  # The deploy-repo instances are matched by id prefix, like the units.
  - "/^ss:jenkins-prd-jenkins-jenkins,/"
  - "/^ss:trello-mcp-prd-trello-mcp-server,/"
  - "/^ss:git-sync-prd-gitblit-gitblit-app,/"
  - ss:home-assistant-prd,398e32ec-cbe7-40e4-8a66-094029653650 # Home Assistant
neighbourDepth: 1
