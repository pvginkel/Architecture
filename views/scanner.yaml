id: scanner
label: Scanner
description: The ScanToPdf application - my scanning infrastructure from device to app.
icon: ScanLine
# The release is the grouping handle. `releases: [scantopdf]` selects the app's
# deployed runtime as one set — scan-server, scanned-image-processing, the
# product server, and the samba share — and neighbourDepth 1 pulls each
# container's component definition back in via Specialization. This is what ties
# the three sibling component definitions together; they carry no edges to each
# other, only their shared release does.
#
# Two definitions are named in include. The ScanToPdf product (its own producer)
# anchors the app's surface, landing the ScanToPdf API and the consumes-sane edge
# at depth 1. The SANE station carries no release — it is separate hardware — so
# its four elements are named explicitly; the consumes-sane relation stitches app
# and station into one connected graph, and the station's own edges (Assignment,
# Realization, Composition) sit between included elements so the physical scanner
# renders without depending on neighbour expansion.
predicate:
  releases: [scantopdf]
include:
  # ScanToPdf product definition (producer scantopdf-server) — anchors the app surface
  - app:scantopdf-server,3a9b1929-7c0d-4dbf-b725-42549c12bc31
  # SANE scanner station (shared `architecture` producer, no release)
  - node:scanner-pi,7cb7b613-4049-4a0d-a640-a2fa6d28182d
  - device:canoscan-lide-400,7474469e-6ab1-45ff-a8ed-fa569512a643
  - ss:sane,dad94c80-25d2-43cb-87da-fa6a284256db
  - svc:sane,e84330dd-c453-4bd4-a112-f83366de453c
neighbourDepth: 1
