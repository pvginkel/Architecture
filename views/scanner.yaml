id: scanner
label: Scanner
description: The ScanToPdf application and the SANE scanner station (Raspberry Pi + Canon scanner) it drives.
# The product is its own producer (`scantopdf-server`), but its two sibling
# components — scan-server and scanned-image-processing — come from the shared
# `docker-images` producer and carry NO edges to the product or each other at
# the definition level. The only thing binding the three into one application is
# the prd runtime: each `scantopdf` release container Specialization→ its
# definition and Realization→ the single release service. So the four release
# instances are named explicitly; neighbourDepth 1 then pulls their definitions
# back in via Specialization (no need to hardcode the docker-images defs).
#
# The SANE station lives under the shared `architecture` producer (alongside
# home-automation/infra), so its four elements are named explicitly too. The
# `scantopdf-server-consumes-sane` relation stitches app and station into one
# connected graph; the station's own edges (Assignment, Realization,
# Composition) all sit between included elements, so the physical scanner and
# its links render without depending on neighbour expansion.
predicate:
  producers: [scantopdf-server]
include:
  # SANE scanner station (shared `architecture` producer)
  - node:scanner-pi,7cb7b613-4049-4a0d-a640-a2fa6d28182d
  - device:canoscan-lide-400,7474469e-6ab1-45ff-a8ed-fa569512a643
  - ss:sane,dad94c80-25d2-43cb-87da-fa6a284256db
  - svc:sane,e84330dd-c453-4bd4-a112-f83366de453c
  # scantopdf prd runtime — binds the three sibling component definitions
  - app:scantopdf-scantopdf-scan-server,05d1b77e-60b5-5ade-ace2-2b5a008e76f1
  - app:scantopdf-scantopdf-scanned-image-processing,c26c37b9-761a-50a0-9173-23e3fbf0cd37
  - app:scantopdf-scantopdf-scantopdf-server,0549434b-47ad-50fd-8fb7-a93cf445d357
  - ss:scantopdf-samba-samba,c80a49d4-6b0f-512f-9df8-1940f1bec348
neighbourDepth: 1
