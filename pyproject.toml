[tool.poetry]
name = "architecture-orchestration"
version = "0.1.0"
description = "AIWorkflow orchestration tooling for the Architecture repo (code-health grader + dev-agent session manager)."
authors = ["Pieter van Ginkel <pvginkel@gmail.com>"]
packages = [{include = "tools"}]

[tool.poetry.dependencies]
python = "^3.11"
pathspec = "^0.12"

[tool.poetry.scripts]
code-health = "tools.code_health.__main__:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
