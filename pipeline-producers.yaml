# Registry of architecture producers. The Jenkinsfile reads this to know
# which copyArtifacts calls to issue; the collector reads it to know which
# producer-artifacts/<id>/ directories must exist. Adding a producer is a
# PR against this file. Schema: pipeline-producers.schema.yaml.
#
# v3 ships empty — producers come online in v4 (Ansible first).

producers:
  - id: ansible
    jenkinsJob: AaC/Ansible
  - id: architecture
  - id: home-automation-fleet
    # Daily HA-fleet snapshot — its own scheduled job (Jenkinsfile.ha-fleet),
    # not build-triggered. Job name has spaces; rename the job + this value to
    # AaC/HomeAutomationFleet if the upstream-trigger join is ever fussy.
    jenkinsJob: AaC/Home Assistant Fleet
  - id: helm-charts
    jenkinsJob: AaC/HelmCharts
  - id: docker-images
    jenkinsJob: AaC/DockerImages
  - id: ssegateway
    jenkinsJob: AaC/SSEGateway
    defaultLogo: sse-gateway
  - id: electronics-inventory
    jenkinsJob: AaC/ElectronicsInventory
    defaultLogo: electronics-inventory
  - id: iotsupport-app
    jenkinsJob: AaC/IoTSupport
    defaultLogo: iot-support
  - id: dhcpapp
    jenkinsJob: AaC/DHCPApp
    defaultLogo: dnsmasq
  - id: dhcpapp-ui
    jenkinsJob: AaC//DHCPAppUI
    defaultLogo: dnsmasq
  - id: zigbee-control
    jenkinsJob: AaC/ZigbeeControl
    defaultLogo: zigbee2mqtt
  - id: zigbee-control-ui
    jenkinsJob: AaC/ZigbeeControlUI
    defaultLogo: zigbee2mqtt
  - id: design-assistant
    jenkinsJob: AaC/DesignAssistant
    defaultLogo: design-assistant
  - id: ginbov-nl
    jenkinsJob: AaC/Ginbov
    defaultLogo: ginbov-nl
  - id: newsfilter
    jenkinsJob: AaC/NewsFilter
    defaultLogo: newsfilter
  - id: scantopdf-server
    jenkinsJob: AaC/ScanToPdf
    defaultLogo: scantopdf
  - id: webathome-org
    jenkinsJob: AaC/Webathome
    defaultLogo: webathome
  - id: mydownloads-server
    jenkinsJob: AaC/MyDownloadsServer
    defaultLogo: mydownloads
  - id: gitblit-mcp-server
    jenkinsJob: AaC/GitblitMCPServer
    defaultLogo: gitblit
  - id: gitblit-initializer
    jenkinsJob: AaC/GitblitMCPSupportPlugin
    defaultLogo: gitblit
  # ── batch 2: ESP32 firmware, Android clients, kiosk, intercom server ──
  - id: calendar-display
    jenkinsJob: AaC/CalendarDisplay
  - id: doorbell-receiver
    jenkinsJob: AaC/DoorbellReceiver
  - id: gesture-device
    jenkinsJob: AaC/GestureDevice
  - id: underfloor-heating-controller
    jenkinsJob: AaC/UnderfloorHeatingController
  - id: somfy-remote
    jenkinsJob: AaC/SomfyRemote
  - id: paper-clock
    jenkinsJob: AaC/PaperClock
  - id: intercom
    jenkinsJob: AaC/Intercom
  - id: infra-statistics-display
    jenkinsJob: AaC/InfraStatisticsDisplay
  - id: intercom-server
    jenkinsJob: AaC/IntercomServer
    defaultLogo: intercom-server
  - id: scantopdf-client
    jenkinsJob: AaC/ScanToPdfClient
    defaultLogo: scantopdf
  - id: mydownloads-client
    jenkinsJob: AaC/MyDownloadsClient
    defaultLogo: mydownloads
  - id: kitchen-display
    jenkinsJob: AaC/KitchenDisplay
  - id: kubecoder
    jenkinsJob: AaC/KubeCoder
    defaultLogo: kubecoder
