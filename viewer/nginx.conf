map $sent_http_content_type $frame_ancestors {
    default "frame-ancestors 'self' https://webathome.org https://www.webathome.org";
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    # Allow webathome.org (apex + www) to embed the viewer in an iframe.
    # nginx resets inherited add_header in any location that defines its own,
    # so the CSP is repeated in each location below that sets Cache-Control.
    add_header Content-Security-Policy $frame_ancestors always;

    # Fingerprinted Vite assets — long cache.
    location /viewer/assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $frame_ancestors always;
        try_files $uri =404;
    }

    # Logos and other static files under /viewer/ — short cache, allow rebuild refresh.
    location /viewer/logos/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Security-Policy $frame_ancestors always;
        try_files $uri =404;
    }

    # HTML always revalidates.
    location ~* /viewer/.*\.html$ {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $frame_ancestors always;
        try_files $uri =404;
    }

    # SPA fallback scoped to /viewer/.
    location /viewer/ {
        try_files $uri $uri/ /viewer/index.html;
    }

    # Container root is reserved for future siblings (/schema, /api, health).
    # For v0 return a 404 so misrouted requests are obvious.
    location = / {
        return 404;
    }
}
