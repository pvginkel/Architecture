# Producer profiles.
#
# Each producer entry in pipeline-producers.yaml declares a profile.
# The profile is descriptive metadata only — the collector does not
# enforce a per-kind allow-list. Multiple producers can share a profile
# (e.g., different app repos all declaring profile=application).

$id: https://architecture.webathome.org/schema/v0.1/enums/producer-profiles.yaml
entries:
  - id: infra-physical
    label: Physical infrastructure
    summary: Ansible-owned hardware, VMs, OS-level installs.
    lifecycle: active

  - id: cluster-services
    label: Cluster services
    summary: HelmCharts-owned shared cluster services.
    lifecycle: active

  - id: images
    label: Image identity
    summary: DockerImages-owned image identity and build provenance. (Most fields v0.2.)
    lifecycle: active

  - id: application
    label: Application
    summary: Application repos (EI, IoT, Design Assistant, others) — own pods, queues, storage, ingress.
    lifecycle: active
