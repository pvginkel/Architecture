$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/schema/v0.1/generated/systemsoftware.schema.yaml
title: SystemSoftware (ArchiMate SystemSoftware)
description: Infra/middleware runtime. Running Keycloak, Postgres, nginx, OpenBao, dnsmasq.
type: object
additionalProperties: false
required:
- id
- label
- summary
- introduced
- lifecycle
properties:
  id:
    type: string
    pattern: ^ss:[a-z][a-z0-9-]*,[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Stable identifier. Prefix + format per element kind.
  label:
    description: Display string. May change without ID change.
    type: string
    minLength: 1
  summary:
    description: One or two sentences. Maps to ArchiMate documentation.
    type: string
    minLength: 1
  introduced:
    description: ISO-8601 date when the element was first declared.
    type: string
    format: date
  lifecycle:
    description: Lifecycle state.
    type: string
    enum:
    - active
    - deprecated
    - removed
  retirementBy:
    description: ISO-8601 date when the element is planned for retirement. Optional, informational.
    type: string
    format: date
  stats:
    description: "Non-load-bearing facts (versions, URLs, image tags). Render hints. Free-form string\u2192string."
    type: object
    additionalProperties:
      type: string
  environment:
    description: DTAP stage. Custom attribute, not ArchiMate's Plateau.
    type: string
    enum:
    - dev
    - tst
    - uat
    - prd
  cluster:
    description: Cluster identifier when the element lives inside one.
    type: string
    minLength: 1
  stereotype:
    type: string
    enum:
    - SoftwareProduct
    description: Optional stereotype marker.
  homepage:
    description: Upstream product homepage, if applicable.
    type: string
    format: uri
  logo:
    description: Filename under viewer/public/logos/.
    type: string
    minLength: 1
  sourceRepository:
    description: "Free-form source-repository identifier for in-house products, e.g. `git:pvginkel/Ansible`. Informational\
      \ only \u2014 no graph edge is derived from this field.\n"
    type: string
    minLength: 1
allOf:
- if:
    not:
      required:
      - stereotype
  then:
    allOf:
    - not:
        required:
        - homepage
    - not:
        required:
        - logo
    - not:
        required:
        - sourceRepository
