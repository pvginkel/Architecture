$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/schema/v0.1/generated/relations.schema.yaml
title: Relations (ArchiMate 3.2 triple matrix, narrowed to v0.1 subset)
description: A relation entry. Each (source, target, type) triple must appear in the x-allowedTriples enumeration below. Source
  and target are id references to elements whose source-kind and target-kind appear in the triple. The validation service
  performs the kind lookup at validate time; this schema only constrains type names and structural shape.
type: object
additionalProperties: false
required:
- id
- source
- target
- type
properties:
  id:
    type: string
    pattern: ^rel:[a-z][a-z0-9-]*$|^rel:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Stable identifier for this relation.
  source:
    type: string
    description: Source element id.
  target:
    type: string
    description: Target element id.
  type:
    type: string
    enum:
    - Access
    - Aggregation
    - AndJunction
    - Assignment
    - Association
    - Composition
    - Flow
    - Influence
    - OrJunction
    - Realization
    - Serving
    - Specialization
    - Triggering
    description: ArchiMate relationship type.
