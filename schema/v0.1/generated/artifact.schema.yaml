$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/schema/v0.1/generated/artifact.schema.yaml
title: Artifact (ArchiMate Artifact)
description: Deployable bundle or repository content. Helm chart, Ansible role, TF module, source repo, Jenkinsfile.
type: object
additionalProperties: false
required:
- id
- label
- summary
- introduced
- lifecycle
properties:
  id:
    type: string
    pattern: ^art:[a-z][a-z0-9-]*(,[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})?$
    description: Stable identifier. Prefix + format per element kind.
  label:
    description: Display string. May change without ID change.
    type: string
    minLength: 1
  summary:
    description: One or two sentences. Maps to ArchiMate documentation.
    type: string
    minLength: 1
  introduced:
    description: ISO-8601 date when the element was first declared.
    type: string
    format: date
  lifecycle:
    description: Lifecycle state.
    type: string
    enum:
    - active
    - deprecated
    - removed
  retirementBy:
    description: ISO-8601 date when the element is planned for retirement. Optional, informational.
    type: string
    format: date
  stats:
    description: "Non-load-bearing facts (versions, URLs, image tags). Render hints. Free-form string\u2192string."
    type: object
    additionalProperties:
      type: string
  environment:
    description: DTAP stage this Artifact targets. Custom attribute, not Plateau.
    type: string
    enum:
    - dev
    - tst
    - uat
    - prd
  stereotype:
    type: string
    enum:
    - Repository
    - Producer
    description: Optional stereotype marker.
  url:
    description: Repository URL (e.g. GitHub HTTPS URL).
    type: string
    format: uri
  role:
    description: What this repository holds.
    type: string
    enum:
    - source
    - spec
    - config
  languageMix:
    description: "Language \u2192 percentage. Informational."
    type: object
    additionalProperties:
      type: string
  owner:
    description: Human or team responsible.
    type: string
    minLength: 1
allOf:
- if:
    properties:
      stereotype:
        const: Repository
    required:
    - stereotype
  then:
    required:
    - url
    - role
    - owner
- if:
    not:
      required:
      - stereotype
  then:
    allOf:
    - not:
        required:
        - languageMix
    - not:
        required:
        - owner
    - not:
        required:
        - role
    - not:
        required:
        - url
