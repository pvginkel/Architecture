$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/schema/v0.1/generated/technologyinterface.schema.yaml
title: TechnologyInterface (ArchiMate TechnologyInterface)
description: Addressable point on a TechnologyService. Queue, topic, OpenBao path, DB name, subvolume.
type: object
additionalProperties: false
required:
- id
- label
- summary
- introduced
- lifecycle
properties:
  id:
    type: string
    pattern: ^if:[a-z][a-z0-9-]*,[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    description: Stable identifier. Prefix + format per element kind.
  label:
    description: Display string. May change without ID change.
    type: string
    minLength: 1
  summary:
    description: One or two sentences. Maps to ArchiMate documentation.
    type: string
    minLength: 1
  introduced:
    description: ISO-8601 date when the element was first declared.
    type: string
    format: date
  lifecycle:
    description: Lifecycle state.
    type: string
    enum:
    - active
    - deprecated
    - removed
  retirementBy:
    description: ISO-8601 date when the element is planned for retirement. Optional, informational.
    type: string
    format: date
  stats:
    description: "Non-load-bearing facts (versions, URLs, image tags). Render hints. Free-form string\u2192string."
    type: object
    additionalProperties:
      type: string
  logo:
    description: 'Name of a logo from the bundled library (viewer/public/logos/), without the file extension (e.g. `ubiquiti`).
      Picked from the curated set; validated against it. Optional, on any kind.

      '
    type: string
    enum:
    - ansible
    - c
    - calico
    - ceph
    - code-server
    - coredns
    - cpp
    - csharp
    - design-assistant
    - dnsmasq
    - docker
    - elastic
    - elasticsearch
    - electronics-inventory
    - external-secrets
    - federated-aac
    - ginbov-nl
    - gitblit
    - github
    - gluetun
    - go
    - grafana
    - guacamole
    - haproxy
    - headlamp
    - helm
    - home-assistant
    - html5
    - intercom-server
    - iot-support
    - java
    - javascript
    - jenkins
    - json
    - kaniko
    - keepalived
    - keycloak
    - kibana
    - kubecoder
    - kubernetes
    - markdown
    - maven
    - metallb
    - mosquitto
    - msbuild
    - mydownloads
    - newsfilter
    - nginx
    - nodejs
    - openai
    - openbao
    - opensearch
    - pgadmin
    - playwright
    - plex
    - pnpm
    - poetry
    - postgresql
    - prometheus
    - proxmox
    - pytest
    - python
    - qemu
    - rabbitmq
    - rclone
    - ruff
    - rust
    - s3
    - samba
    - scantopdf
    - smallstep
    - sse-gateway
    - systemd
    - telegram
    - terraform
    - typescript
    - ubiquiti
    - ubuntu
    - webathome
    - xaml
    - xml
    - yaml
    - zigbee2mqtt
  environment:
    description: DTAP stage. Omit for surfaces that span environments (e.g. external APIs).
    type: string
    enum:
    - dev
    - tst
    - uat
    - prd
  cluster:
    description: Cluster identifier when the interface is cluster-scoped.
    type: string
    minLength: 1
