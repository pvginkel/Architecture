# expect: /nodes/0
#
# Node is lifecycle=removed but carries replacedBy. The lifecycle:removed
# conditional rule forbids both replacedBy and retirementBy on removed
# elements (cleanup signal — once removed, the entry should be reference-
# free and ready to be deleted from the producer's emission).

schemaVersion: "0.1"
producer: art:helmcharts

artifacts:
  - id: art:helmcharts
    label: HelmCharts repo
    summary: Producer artifact.
    introduced: 2024-07-12
    lifecycle: active
    producer: art:helmcharts
    stereotype: Producer
    url: https://github.com/pvginkel/HelmCharts
    role: source
    owner: Pieter van Ginkel

nodes:
  - id: node:retired-cluster
    label: Retired cluster
    summary: Removed node with a forbidden replacedBy.
    introduced: 2022-01-01
    lifecycle: removed
    producer: art:helmcharts
    replacedBy: node:prd-cluster
