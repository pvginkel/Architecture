# expect: /nodes/0/id
#
# Node id violates the kebab-case regex (uppercase + underscore not allowed).

schemaVersion: "0.1"
producer: helmcharts

nodes:
  - id: node:Bad_ID
    label: Bad node
    summary: ID uses uppercase and underscore — both rejected by the regex.
    introduced: 2024-07-12
    lifecycle: active
