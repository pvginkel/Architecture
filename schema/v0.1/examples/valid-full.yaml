# Full-coverage artifact: exercises every subset element kind plus one
# representative relation of several ArchiMate relationship types. Mirrors
# (a simplified slice of) what HelmCharts would emit for the prd cluster:
# Keycloak realising IAM, EI as an in-house application stack, Postgres as
# a shared platform service, plus an external API endpoint.

schemaVersion: "0.1"
producer: helmcharts

devices:
  - id: device:proxmox-pve1,22222222-2222-4222-8222-222222222221
    label: pve1
    summary: "Proxmox node #1."
    introduced: 2024-07-12
    lifecycle: active

nodes:
  - id: node:prd-cluster,33333333-3333-4333-8333-333333333331
    label: Production Kubernetes cluster
    summary: Three-node microk8s cluster on srvk8s1/2/3.
    introduced: 2024-07-12
    lifecycle: active
    cluster: prd

systemSoftware:
  - id: ss:postgresql,8df6a422-ee36-428d-9b96-cc65538e2772
    label: PostgreSQL
    summary: Software product identity for Postgres.
    introduced: 2024-07-12
    lifecycle: active
    stereotype: SoftwareProduct
    homepage: https://www.postgresql.org/
    logo: postgresql.svg

  - id: ss:keycloak,2d45bc1f-81c0-4a98-8c00-5aad17e55214
    label: Keycloak
    summary: Software product identity for Keycloak.
    introduced: 2024-09-04
    lifecycle: active
    stereotype: SoftwareProduct
    homepage: https://www.keycloak.org/
    logo: keycloak.svg

  - id: ss:keycloak-prd,44444444-4444-4444-8444-444444444441
    label: Keycloak (prd)
    summary: Running Keycloak instance backing all internal apps.
    introduced: 2024-09-04
    lifecycle: active
    environment: prd
    cluster: prd

  - id: ss:postgres-shared-prd,44444444-4444-4444-8444-444444444442
    label: Shared Postgres (prd)
    summary: Cluster-shared Postgres providing relational storage to applications.
    introduced: 2026-05-01
    lifecycle: active
    environment: prd
    cluster: prd

applicationComponents:
  - id: app:ei-frontend-prd,55555555-5555-4555-8555-555555555551
    label: EI frontend (prd)
    summary: Electronics Inventory web UI.
    introduced: 2025-08-27
    lifecycle: active
    environment: prd
    cluster: prd

  - id: app:ei-backend-prd,55555555-5555-4555-8555-555555555552
    label: EI backend (prd)
    summary: Electronics Inventory REST API.
    introduced: 2025-08-27
    lifecycle: active
    environment: prd
    cluster: prd

applicationServices:
  - id: svc:ei-backend-api,66666666-6666-4666-8666-666666666661
    label: EI backend API
    summary: Internal HTTP API consumed by the EI frontend.
    introduced: 2025-08-27
    lifecycle: active

applicationInterfaces:
  - id: if:ei-backend-rest,77777777-7777-4777-8777-777777777771
    label: EI backend REST endpoint
    summary: /api/v1 paths exposed by the EI backend.
    introduced: 2025-08-27
    lifecycle: active

technologyServices:
  - id: svc:oidc-issuer,66666666-6666-4666-8666-666666666662
    label: OIDC issuer
    summary: auth.webathome.org OpenID Connect issuer realising IAM.
    introduced: 2024-09-04
    lifecycle: active

  - id: svc:postgres-shared,66666666-6666-4666-8666-666666666663
    label: Shared Postgres
    summary: Cluster-shared Postgres at pg.cluster.svc:5432.
    introduced: 2026-05-01
    lifecycle: active
    environment: prd
    cluster: prd

  - id: svc:github-api,66666666-6666-4666-8666-666666666664
    label: GitHub API
    summary: External GitHub REST API. Spans environments — no `environment` field.
    introduced: 2024-07-12
    lifecycle: active

technologyInterfaces:
  - id: if:postgres-5432,77777777-7777-4777-8777-777777777772
    label: Postgres TCP 5432
    summary: Default Postgres protocol port.
    introduced: 2026-05-01
    lifecycle: active

capabilities:
  - id: cap:iam
    label: Identity & Access Management
    summary: Identity store, authentication, authorisation, SSO realisation.
    introduced: 2024-07-12
    lifecycle: active

  - id: cap:relational-database
    label: Relational database
    summary: SQL-tabular persistence with transactions and joins.
    introduced: 2024-07-12
    lifecycle: active

businessServices:
  - id: bsvc:single-sign-on
    label: Single Sign-On
    summary: Users authenticate once and access multiple internal apps.
    introduced: 2024-09-04
    lifecycle: active

groupings:
  - id: grp:ei-prd,88888888-8888-4888-8888-888888888881
    label: EI prd
    summary: All EI prd components grouped for the renderer.
    introduced: 2025-08-27
    lifecycle: active

relations:
  # ArchiMate 3.2 puts active technology elements on the *source* side of
  # Realization/Assignment when they enable application elements, hence the
  # node-as-source direction here.
  - id: rel:cluster-realises-ei-frontend
    source: node:prd-cluster,33333333-3333-4333-8333-333333333331
    target: app:ei-frontend-prd,55555555-5555-4555-8555-555555555551
    type: Realization

  - id: rel:cluster-realises-ei-backend
    source: node:prd-cluster,33333333-3333-4333-8333-333333333331
    target: app:ei-backend-prd,55555555-5555-4555-8555-555555555552
    type: Realization

  - id: rel:cluster-runs-keycloak
    source: node:prd-cluster,33333333-3333-4333-8333-333333333331
    target: ss:keycloak-prd,44444444-4444-4444-8444-444444444441
    type: Assignment

  - id: rel:ei-frontend-uses-backend
    source: app:ei-frontend-prd,55555555-5555-4555-8555-555555555551
    target: svc:ei-backend-api,66666666-6666-4666-8666-666666666661
    type: Serving

  # TechnologyService serves the consuming application (Serving runs from the
  # provider to the consumer in ArchiMate).
  - id: rel:shared-pg-serves-ei-backend
    source: svc:postgres-shared,66666666-6666-4666-8666-666666666663
    target: app:ei-backend-prd,55555555-5555-4555-8555-555555555552
    type: Serving

  - id: rel:oidc-realises-iam
    source: svc:oidc-issuer,66666666-6666-4666-8666-666666666662
    target: cap:iam
    type: Realization

  - id: rel:keycloak-realises-iam
    source: ss:keycloak-prd,44444444-4444-4444-8444-444444444441
    target: cap:iam
    type: Realization

  # Provider-agnostic consumption edge: the backend consumes IAM. `boundBy`
  # is the binding recipe — the producer that renders the deployment resolves
  # env OIDC_ISSUER_URL to the concrete IAM provider and emits the Serving
  # edge. The recipe lives on this edge (with the consumer), not in packaging.
  - id: rel:ei-backend-consumes-iam
    source: app:ei-backend-prd,55555555-5555-4555-8555-555555555552
    target: cap:iam
    type: Association
    boundBy: "env:OIDC_ISSUER_URL"

  - id: rel:keycloak-instance-of-product
    source: ss:keycloak-prd,44444444-4444-4444-8444-444444444441
    target: ss:keycloak,2d45bc1f-81c0-4a98-8c00-5aad17e55214
    type: Specialization

  - id: rel:shared-pg-realises-rel-db
    source: ss:postgres-shared-prd,44444444-4444-4444-8444-444444444442
    target: cap:relational-database
    type: Realization

  # The running Postgres composes the TCP interface it exposes; the interface
  # is a structural part of the system-software, not of the technology-service.
  - id: rel:postgres-instance-composes-5432
    source: ss:postgres-shared-prd,44444444-4444-4444-8444-444444444442
    target: if:postgres-5432,77777777-7777-4777-8777-777777777772
    type: Composition

  # BusinessService realises Capability (the SSO service realises the IAM
  # capability), reversing the natural English direction.
  - id: rel:sso-realises-iam
    source: bsvc:single-sign-on
    target: cap:iam
    type: Realization

  - id: rel:grouping-aggregates-frontend
    source: grp:ei-prd,88888888-8888-4888-8888-888888888881
    target: app:ei-frontend-prd,55555555-5555-4555-8555-555555555551
    type: Aggregation

  - id: rel:grouping-aggregates-backend
    source: grp:ei-prd,88888888-8888-4888-8888-888888888881
    target: app:ei-backend-prd,55555555-5555-4555-8555-555555555552
    type: Aggregation
