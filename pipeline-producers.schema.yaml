$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/pipeline-producers.schema.yaml
title: pipeline-producers
description: |
  Registry of architecture producers consumed by both the Jenkinsfile (for
  copyArtifacts calls) and tooling/collect.py (for "must be present" checks).
  Schema-validated at collector startup; entries that don't match fail the run.

type: object
additionalProperties: false
required: [producers]
properties:
  producers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          description: |
            Producer id. Kebab-case. Doubles as the directory name under
            producer-artifacts/<id>/.
          pattern: ^[a-z][a-z0-9-]*$
        jenkinsJob:
          type: string
          description: |
            Jenkins job path, typically `<folder>/<branch>` (e.g.,
            `ansible/master`). Used by the Jenkinsfile's copyArtifacts step.
            Omit for self-producers whose source lives in this repo (the
            Jenkinsfile copies docs/architecture/ locally instead).
          minLength: 1
        defaultLogo:
          type: string
          description: |
            Fallback bare logo name (no extension) stamped by the collector
            onto any element of this producer that resolves no logo of its own
            (own → Specialization → realizing component → assigned/composing
            owner). For single-family in-house producers, this gives the whole
            product family one logo from a single line. Validated against the
            bundled logo library at collect time. Omit for multi-product
            producers (docker-images, helm-charts) — they carry per-product
            logos instead.
          minLength: 1
