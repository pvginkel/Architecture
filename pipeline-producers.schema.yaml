$schema: https://json-schema.org/draft/2020-12/schema
$id: https://architecture.webathome.org/pipeline-producers.schema.yaml
title: pipeline-producers
description: |
  Registry of architecture producers, read by the Jenkinsfile (for
  copyArtifacts calls), tooling/collect.py (for "must be present" checks) and
  tooling/fleet.py (the central architecture update, which clones each `repo`).
  Schema-validated at collector startup; entries that don't match fail the run.

type: object
additionalProperties: false
required: [producers]
properties:
  producers:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [id, jenkinsJob]
      properties:
        id:
          type: string
          description: |
            Producer id. Kebab-case. Doubles as the directory name under
            producer-artifacts/<id>/.
          pattern: ^[a-z][a-z0-9-]*$
        repo:
          type: string
          description: |
            GitHub repository holding the producer's architecture sources, as
            `owner/name` (e.g., `pvginkel/Ansible`) — the repository the
            producer's AaC job checks out, and the one the central architecture
            update clones. Not a URL and no `.git` suffix.
            Omit only for a producer whose artifact no repository's sources
            maintain (home-automation-fleet, generated from the live fleet).
          pattern: ^[A-Za-z0-9][A-Za-z0-9-]*/(?!.*\.git$)[A-Za-z0-9._-]+$
        jenkinsJob:
          type: string
          description: |
            The Jenkins job that builds and archives the producer's artifact,
            as a job path (e.g., `AaC/Ansible`). The Jenkinsfile copies the
            artifact from its last successful build and wires it as an
            upstream trigger; the central architecture update tracks it after
            a push and reports the producer unresolved when a push does not
            start it. For the self-producer it is this repo's own pipeline.
          minLength: 1
        self:
          type: boolean
          const: true
          description: |
            Marks the self-producer, whose artifact is docs/architecture/ in
            this repo: the Jenkinsfile copies those files locally instead of
            from `jenkinsJob`'s archive, and leaves `jenkinsJob` — this very
            pipeline — out of its upstream triggers. Omit for every other
            producer.
        trigger:
          type: boolean
          const: false
          description: |
            Leaves `jenkinsJob` out of the Jenkinsfile's upstream triggers; its
            artifact is still copied, at the next build something else starts.
            For a producer whose repo this pipeline writes into — the image pin
            in WebathomeOrgDeploy — where the trigger would start this pipeline
            again on every build of its own, without end. Omit for every other
            producer.
        defaultLogo:
          type: string
          description: |
            Fallback bare logo name (no extension) stamped by the collector
            onto any element of this producer that resolves no logo of its own
            (own → Specialization → realizing component → assigned/composing
            owner). For single-family in-house producers, this gives the whole
            product family one logo from a single line. Validated against the
            bundled logo library at collect time. Omit for multi-product
            producers (docker-images, architecture) — they carry per-product
            logos instead.
          minLength: 1
