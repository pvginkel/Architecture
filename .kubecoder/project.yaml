projects:
  root:
    description: >-
      Architecture — federated Architecture-as-Code for webathome.org: the merge
      pipeline, the viewer that renders it, and the service that publishes both.
    jenkins: AaC/Architecture
    # No setup: the root Poetry env existed only for the code-health grader,
    # which /dev:onboard retired along with the root pyproject.toml.
    #
    # Root's testable asset is docs/architecture/ — this repo's own published
    # architecture artifact, which the collector federates like any producer's.
    # Until now nothing checked it before CI: a broken self-producer file only
    # surfaced in the Jenkins collector stage. validate.py checks one artifact
    # against schema/v0.1/architecture.schema.yaml offline, so the loop below is
    # a cheap local gate on the files a root-targeted phase actually edits. It
    # borrows tooling's Poetry env, which `kc project setup` installs.
    test: >-
      cexec modern-app sh -c 'cd tooling && for f in ../docs/architecture/*.yaml;
      do poetry run python validate.py "$f" || exit 1; done'

  tooling:
    description: >-
      Python merge pipeline (collect → generate → validate) plus the metaschema
      codegen. Poetry, ruff, mypy strict, pytest.
    setup: cexec modern-app poetry install --no-interaction
    # --check fails when the committed schema/v0.1/generated/ tree and the viewer
    # vocab are stale against subset.yaml and the vendored ArchiMate sources. The
    # Dockerfile runs the same command as its first stage.
    build: cexec modern-app poetry run python generate.py --check
    test:
      - cexec modern-app poetry run python validate.py meta
      - cexec modern-app poetry run pytest
    lint:
      - cexec modern-app poetry run ruff check .
      - cexec modern-app poetry run mypy .

  viewer:
    description: >-
      React + ReactFlow + ELK viewer (Vite, TypeScript) that renders the merged
      dataset. `npm run build` type-checks with tsc --noEmit before bundling.
    setup: cexec modern-app npm ci
    build: cexec modern-app npm run build
    test: cexec modern-app npm test

  service:
    description: >-
      Express + TypeScript service that serves the viewer bundle, the published
      dataset and the POST /api/validate endpoint. `npm run build` is tsc.
    setup: cexec modern-app npm ci
    build: cexec modern-app npm run build
    test: cexec modern-app npm test

# No `lint` on viewer/service: neither has a linter configured, and their builds
# already run tsc. Adding one is a decision, not an oversight.
