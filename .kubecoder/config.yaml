# The Architecture environment.
#
# Primary repo: Architecture (Architecture-as-Code pipeline + viewer + service).
# The environment is wider than this repo: it also carries the reference repos
# whose architecture.yaml files this pipeline federates.

repos:
  # The specs repo: slices, change-request bundles, the decision index.
  - url: https://github.com/pvginkel/ArchitectureSpecs
    shared: true

  # Producer repos this pipeline federates, read (and occasionally edited) here.
  - url: https://github.com/pvginkel/HelmCharts
  - url: https://github.com/pvginkel/Ansible
  - url: https://github.com/pvginkel/DockerImages

capabilities:
  github: rw

tools:
  # Node and Python in one sidecar: the merge pipeline (tooling/) is Python under
  # poetry, the viewer and the service are npm.
  - use: modern-app

# The deliverable is a container image that is not built locally otherwise —
# Jenkins builds it with helmCharts.kaniko. This is here so a Dockerfile change
# can be smoke-tested in-env:
#   kaniko --destination registry:5000/architecture:dev
# Deliberately not wired into `kc project build`, because it cannot pass: the
# run-collector stage needs a producer-artifacts/ tree that only the Jenkinsfile
# assembles. The build does exercise the schema check and both npm builds before
# it gets there, which is what makes it a useful smoke test.
imageBuilder: true

secrets:
  # track_build.py, for following a pushed AaC/Architecture build.
  JENKINS_TOKEN: jenkins-token

packages: []

setup:
  - kc project setup

preamble:
  instructions: |
    This environment holds the Architecture-as-Code pipeline (Architecture)
    alongside the producer repos it federates: HelmCharts, Ansible and
    DockerImages.

    Everything builds through `kc project` — the toolchain lives in the
    `modern-app` sidecar, so ad-hoc poetry/npm commands need `cexec modern-app`.

    tools/ha-fleet/gen-ha-fleet.py cannot run here: HA_URL/HA_TOKEN are not in
    the secret catalog. That producer runs only in its Jenkins job
    (Jenkinsfile.ha-fleet), which reads the token from OpenBao.

ports:
  # The viewer's Vite dev server (`scripts/dev.sh`).
  - name: viewer
    port: 5173
    type: http
    sslOffload: true

  # The Architecture service.
  - name: service
    port: 8080
    type: http
    sslOffload: true

homeOverlays: []
